plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.counterpick.mlbb'
    compileSdk 34

    defaultConfig {
        applicationId "com.counterpick.mlbb"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    // JSON parsing — used for both the bundled roster/fallback asset and live API responses
    implementation 'com.google.code.gson:gson:2.11.0'

    // Coroutines for capture/analysis pipeline and live stats fetching
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // OpenCV — see settings.gradle for how to wire the ":opencv" module in.
    implementation project(':opencv')
}
