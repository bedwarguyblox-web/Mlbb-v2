buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.4.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Repositories for all modules are declared centrally in settings.gradle's
// dependencyResolutionManagement block (with FAIL_ON_PROJECT_REPOS set), so an
// `allprojects { repositories {...} } here would conflict with that and fail the
// build — removed rather than re-added.

task clean(type: Delete) {
    delete rootProject.buildDir
}
