# AndroidX is required because this project's dependencies (androidx.core,
# androidx.appcompat, com.google.android.material, androidx.lifecycle, etc.)
# are all AndroidX artifacts — without this flag Gradle refuses to build.
android.useAndroidX=true

# Some transitive dependencies here (e.g. legacy support libs pulled in by
# Material) may still reference the old android.support.* namespace; this
# auto-rewrites those references to AndroidX equivalents instead of failing.
android.enableJetifier=true

# Speeds up multi-module builds like this one by running independent Gradle
# tasks (e.g. :app and :opencv) in parallel instead of strictly sequentially.
org.gradle.parallel=true

# Runs Kotlin/Java compilation in a background daemon process shared across
# builds rather than starting a fresh JVM each time — meaningfully faster on
# repeated CI runs.
kotlin.incremental=true
